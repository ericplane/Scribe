name: Assemble Scribe bundle
description: >
  Stage sources, remove API doc blocks, and build the core and optional models.
  Shared by release and smoke-test workflows. Requires Python 3.10+ and the
  Rokit toolchain on PATH.
inputs:
  version:
    description: Version string stamped into the bundle (README + root folder name).
    required: true
runs:
  using: composite
  steps:
    - name: Test documentation stripping
      shell: bash
      run: python3 -m unittest discover -s bundle -p test_stage.py

    - name: Assemble the bundle
      shell: bash
      env:
        VER: ${{ inputs.version }}
      run: |
        # Check originals too, so stripping cannot hide a forbidden URL.
        if grep -rnoE 'https?://[^ "*]+' src bundle/README.luau | grep -viE 'roblox\.com'; then
          echo "::error::off-platform URL in bundle inputs; remove it at the source in src/"
          exit 1
        fi

        python3 bundle/stage.py --version "$VER"
        cp dist/rbxm/Scribe-source-map.json Scribe-source-map.json

    - name: Build Scribe.rbxm
      shell: bash
      run: rojo build dist/rbxm/bundle/rbxm.project.json -o Scribe.rbxm

    # Outside the package and outside the URL backstop: telemetry names Discord by design.
    - name: Build the add-on models
      shell: bash
      run: |
        rojo build dist/rbxm/bundle/telemetry.project.json -o ScribeTelemetry-Addon.rbxm
        rojo build dist/rbxm/bundle/ui-adapters.project.json -o ScribeUIAdapters-Addon.rbxm
        rojo build dist/rbxm/bundle/leaderstats.project.json -o ScribeLeaderstats-Addon.rbxm

    - name: Verify packaged source and executable bytecode
      shell: bash
      run: lune run bundle/verify
