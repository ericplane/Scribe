name: Docs check

# Builds the MkDocs site with --strict on PRs that touch docs sources, so a
# broken doc-comment tag (@function/@within/...) or dead internal link is caught
# on the PR. Build only, no GitHub Pages deploy; that stays in docs.yml on main.

on:
  pull_request:
    paths:
      - "src/**"
      - "docgen/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Build site (strict)
        run: mkdocs build --strict # runs docgen/gen.py via the mkdocs hook
