name: Docs check

# Builds Starlight, validates rendered links, and checks the generator and
# playground on PRs that touch docs sources. No GitHub Pages deployment here.

on:
  pull_request:
    paths:
      - "src/**"
      - "docgen/**"
      - "CHANGELOG.md"
      - "docs-site/**"
      - "rokit.toml"
      - "wally.toml"
      - "wally.lock"
      - "lune/**"
      - "test/**"
      - ".github/workflows/docs-check.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
      - name: Install test host dependencies
        run: wally install
      - name: Install docs dependencies
        run: npm ci --prefix docs-site
      - name: Build site and validate links
        run: npm run build --prefix docs-site
      - name: Check conversion, headings, and the playground
        run: npm run check --prefix docs-site
      - name: Run examples extracted from the guides
        run: lune run docgen/check_examples
