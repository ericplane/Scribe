name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and inspect the core and optional add-ons without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Reuse the same release gate as Wally and the Roblox model build.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing; no long-lived npm token
    env:
      NPM_PACKAGES: >-
        {"./dist/npm":"@rbxts/scribe",
        "./dist/npm-addons/react":"@rbxts/scribe-react",
        "./dist/npm-addons/vide":"@rbxts/scribe-vide",
        "./dist/npm-addons/fusion":"@rbxts/scribe-fusion",
        "./dist/npm-addons/telemetry":"@rbxts/scribe-telemetry",
        "./dist/npm-addons/leaderstats":"@rbxts/scribe-leaderstats"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify trusted-publishing CLI support
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import assert from "node:assert/strict";
          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = version.split(".").map(Number);
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))),
            `npm ${version} is too old for trusted publishing; npm >=11.5.1 is required`);
          NODE
      - name: Install build dependencies
        run: npm ci
      # Strip API doc blocks exactly as the Roblox model builds do.
      - name: Assemble core and optional npm packages
        run: npm run build
      - name: Verify staged executable code
        run: lune run bundle/verify --staging dist/npm-sources --sources-only
      - name: Verify release tag and select distribution tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const pkg = JSON.parse(fs.readFileSync("dist/npm/package.json", "utf8"));
          for (const [directory, name] of Object.entries(JSON.parse(process.env.NPM_PACKAGES))) {
            const addon = JSON.parse(fs.readFileSync(`${directory}/package.json`, "utf8"));
            assert.equal(addon.name, name, `Unexpected package in ${directory}`);
            assert.equal(addon.version, pkg.version, "Every npm package must share the core version");
            console.log(`Verified ${addon.name}@${addon.version}`);
          }
          if (process.env.EVENT_NAME === "release") {
            assert.equal(process.env.TAG_NAME.replace(/^v/, ""), pkg.version,
              "Release tag must match the shared npm, Wally and Luau version");
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            `dist_tag=${pkg.version.includes("-") ? "next" : "latest"}\n`);
          NODE
      - name: Inspect core and addon packages
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          for (const directory of Object.keys(JSON.parse(process.env.NPM_PACKAGES))) {
            // Inspect contents without rejecting versions from a partial release.
            // The publish step below verifies and skips identical existing versions.
            execFileSync("npm", ["pack", directory, "--dry-run"], { stdio: "inherit" });
          }
          NODE
      # Configure EACH package's trusted publisher for ericplane/Scribe and this
      # exact workflow filename, permit direct npm publish, then enable the
      # repository variable. Until then releases only build and dry-run.
      - name: Publish through npm trusted publishing
        if: vars.SCRIBE_NPM_PUBLISH == 'true' && (github.event_name == 'release' || !inputs.dry_run)
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          for (const [directory, name] of Object.entries(JSON.parse(process.env.NPM_PACKAGES))) {
            const pkg = JSON.parse(fs.readFileSync(`${directory}/package.json`, "utf8"));
            // A retry after a partial release skips only identical immutable versions.
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}/${pkg.version}`);
            if (response.ok) {
              const existing = await response.json();
              const report = JSON.parse(execFileSync("npm", ["pack", directory, "--dry-run", "--json"],
                { encoding: "utf8" }));
              const packed = (Array.isArray(report) ? report : Object.values(report))[0];
              assert(packed?.integrity, "npm pack must report the package integrity");
              assert.equal(existing.dist?.integrity, packed.integrity,
                `${name}@${pkg.version} already exists with different contents; refusing to continue`);
              console.log(`${name}@${pkg.version} already published with identical contents; skipping.`);
              continue;
            }
            assert.equal(response.status, 404,
              `Cannot verify ${name}@${pkg.version}: registry returned ${response.status}`);
            execFileSync("npm", ["publish", directory, "--access", "public",
              "--tag", process.env.NPM_DIST_TAG], { stdio: "inherit" });
          }
          NODE
      - name: Explain inactive publishing
        if: vars.SCRIBE_NPM_PUBLISH != 'true'
        run: echo 'Core and addon packages verified. Publishing remains disabled until each npm trusted publisher is configured and SCRIBE_NPM_PUBLISH=true.'
