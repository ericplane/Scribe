name: Bundle smoke test

# Dry-runs the exact rbxm assembly that release-rbxm.yml performs (wally install
# -> copy & sanitize ProfileStore -> off-platform URL backstop -> rojo build)
# WITHOUT publishing. The ProfileStore _Index glob and the URL backstop are
# fragile to a ProfileStore bump; this catches breakage before a release rather
# than during one.
#
# Runs on push to main as well as on PRs: work lands on main directly here, so a
# PR-only trigger meant this never actually fired and the assembly went unchecked
# until release time, which is exactly what it exists to prevent.

on:
  pull_request:
    paths:
      - "src/**"
      - "bundle/**"
      - "wally.toml"
      - "rokit.toml" # toolchain (wally/rojo) bump can break assembly
      - ".github/actions/assemble-bundle/**"
      - ".github/workflows/bundle-smoke.yml"
  # Duplicated rather than a YAML anchor: GitHub's workflow parser does not
  # reliably support anchors, and a filter that silently fails to apply is the
  # exact failure this change exists to fix. Keep the two lists in sync.
  push:
    branches: [main]
    paths:
      - "src/**"
      - "bundle/**"
      - "wally.toml"
      - "rokit.toml"
      - ".github/actions/assemble-bundle/**"
      - ".github/workflows/bundle-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bundle-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1

      - name: Determine version
        id: ver
        run: |
          VER="$(grep -m1 '^version' wally.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "value=${VER}" >> "$GITHUB_OUTPUT"

      - name: Assemble & build (no publish)
        uses: ./.github/actions/assemble-bundle
        with:
          version: ${{ steps.ver.outputs.value }}

      - name: Upload built model for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Scribe-rbxm-pr
          path: Scribe.rbxm
