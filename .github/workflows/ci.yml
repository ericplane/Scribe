name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # lets the release workflows gate on a green run
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref; newer pushes cancel older ones. Release runs use a
# distinct ref (a tag), so this never cancels a release's verify job.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
      - name: Cache rokit tool store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}
      # The headless runner ships its own mini-TestEZ, so no `wally install` here.
      - name: Run test suite
        run: lune run lune/run-tests
      # The same tests as the step above, with every outbound frame forced through
      # Wire.Fragment and reassembled by the real client (TestCtx drops
      # MaxOutboundBytes to 256 when this is set). It is not a duplicate run: the
      # plain suite above splits 27 frames across the whole run -- 18 Diff, 9 Init
      # -- and this one splits 51, the extra 16 being SharedInit and SharedDiff
      # broadcasts that the plain invocation fragments ZERO times. Costs ~28s.
      #
      # If this ever goes red while the step above is green, that is a real
      # finding about the fragment path and not a flake -- the run is
      # deterministic (test/Sim seeds its own Rng; there is no wall clock in the
      # seams). Do not paper over it by dropping this step.
      - name: Run test suite (every frame through the fragment path)
        run: lune run lune/run-tests
        env:
          SCRIBE_FRAGMENT_ALL: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
      - name: Cache rokit tool store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}
      # selene.toml uses std = "roblox+testez"; selene fetches/caches the roblox
      # std on first run. If a runner ever flakes on that fetch, add a
      # `selene generate-roblox-std` step before this one.
      - name: Lint
        run: selene src test lune adapters

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
      - name: Cache rokit tool store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}
      - name: Check formatting
        run: stylua --check src test lune adapters

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
      - name: Cache rokit tool store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}
      - name: Cache Wally packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/wally
          key: wally-${{ runner.os }}-${{ hashFiles('wally.toml') }}
      # Populates DevPackages (TestEZ) so the test.project.json sourcemap resolves.
      - name: Install Wally dependencies
        run: wally install
      - name: Generate sourcemap
        run: rojo sourcemap test.project.json -o sourcemap.json
      - name: Fetch Roblox global type defs
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/${LUAU_LSP_VER}/scripts/globalTypes.d.luau" \
            -o globalTypes.d.luau
        env:
          # Keep in sync with rokit.toml's luau-lsp pin.
          LUAU_LSP_VER: "1.69.0"
      # Positive gate: the typed accessor API and the Scribe() entry point must
      # type-check clean under the NEW solver (--settings mirrors the editor's
      # enableNewSolver). `src` itself is intentionally NOT gated here: the new
      # solver still reports dozens of false positives on the internal code, so
      # only the user-facing type surface (exercised by TypeCheck.luau) is
      # asserted clean.
      - name: Type-check (positive fixture must be clean)
        run: |
          luau-lsp analyze \
            --sourcemap=sourcemap.json \
            --defs=globalTypes.d.luau \
            --settings=.vscode/settings.json \
            --ignore="**/DevPackages/**" \
            --ignore="**/ServerPackages/**" \
            test/TypeCheck.luau \
            test/TypeCheckSignatureA.luau \
            test/TypeCheckSignatureB.luau
      # Negative gate: TypeCheckErrors.luau is a fixture of deliberate type
      # errors. It must report EXACTLY the number of diagnostics declared in its
      # own `EXPECTED_ERRORS:` header. If a change silently loosens the
      # template-aware config types, the count drops and this fails, catching a
      # regression the positive fixture cannot.
      - name: Type-check (negative fixture must report the expected count)
        run: |
          # `|| true`: grep exits 1 on no match, which under `set -eo pipefail`
          # would abort the step before the guard below can print its message.
          expected="$(grep -oE 'EXPECTED_ERRORS: [0-9]+' test/TypeCheckErrors.luau | grep -oE '[0-9]+' || true)"
          if [ -z "$expected" ]; then
            echo "::error::could not read EXPECTED_ERRORS from test/TypeCheckErrors.luau"
            exit 1
          fi
          # analyze exits nonzero because the fixture has errors by design, so we
          # capture output rather than trust the exit code, then count diagnostics
          # (each is anchored by a `(line,col): TypeError:` location prefix).
          set +e
          out="$(luau-lsp analyze \
            --sourcemap=sourcemap.json \
            --defs=globalTypes.d.luau \
            --settings=.vscode/settings.json \
            --ignore="**/DevPackages/**" \
            --ignore="**/ServerPackages/**" \
            test/TypeCheckErrors.luau 2>&1)"
          set -e
          # `|| true`: grep -c exits 1 when the count is 0 (the exact regression
          # this gate catches); without it the step would die before reporting.
          actual="$(printf '%s\n' "$out" | grep -cE '\([0-9]+,[0-9]+\): (TypeError|SyntaxError):' || true)"
          echo "TypeCheckErrors.luau: expected ${expected} diagnostics, got ${actual}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::negative fixture drift: expected ${expected} type errors, got ${actual}. If this change is intentional, update the EXPECTED_ERRORS header in test/TypeCheckErrors.luau."
            printf '%s\n' "$out"
            exit 1
          fi

  clock-seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The three seam checks below are pure grep, but the log-code check at the end
      # of this job runs through lune, so the toolchain has to be here too.
      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
      - name: Cache rokit tool store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.rokit
          key: rokit-${{ runner.os }}-${{ hashFiles('rokit.toml') }}
      # Every reading of time and every timed wait in src/ must route through
      # Internal/Clock, or a simulation cannot fast-forward past it. One stray
      # os.time() is enough to pin a cooldown, a TTL or a retry backoff to real
      # time while everything around it moves -- worse than having no seam at all,
      # because the result LOOKS controllable. It is the kind of thing that creeps
      # back one call at a time, so it is checked rather than trusted.
      #
      # Exempt: Clock.luau itself (it holds the real implementations); Signal.luau
      # (task.spawn there is runner-thread reuse, a scheduler concern rather than a
      # clock one); and the DebugHook pair (Studio tooling, never simulated).
      #
      # Fixed-string matching (-F): the patterns are literals, and a regex here
      # would only be an opportunity to mis-escape a dot.
      # Exempt: src/Internal/Store, the vendored ProfileStore fork. It is upstream
      # code kept line-identical so it stays diffable against upstream, and routing
      # its 57 raw time/thread calls through the seams would rewrite it beyond
      # recognition for no gain. It IS still virtualised, just by a different
      # mechanism: test/Sim loads it as raw source into a per-server environment
      # whose os/task are the simulated ones -- exactly how it behaved when it
      # lived in ServerPackages, outside `src` altogether.
      - name: Time and waits must route through Internal/Clock
        run: |
          HITS=$(grep -rnF --include='*.luau' \
            -e 'os.time()' -e 'os.clock()' -e 'task.wait(' -e 'task.delay(' \
            src \
            | grep -v 'src/Internal/Store/' \
            | grep -v 'src/Internal/Clock.luau' \
            | grep -v 'src/Internal/Signal.luau' \
            | grep -v 'DebugHook.luau' \
            | grep -v ':[[:space:]]*--' || true)
          if [ -n "$HITS" ]; then
            echo "::error::raw time/wait calls outside Internal/Clock:"
            echo "$HITS"
            echo 'Use Clock.Now() / Clock.Monotonic() / Clock.Wait() / Clock.Delay().'
            exit 1
          fi
          echo 'All time and wait calls route through Internal/Clock.'

      # The same argument, for who runs next rather than when. A raw task.spawn
      # starts a thread the simulation's scheduler never sees, so it cannot be
      # interleaved, cannot be counted as live, and cannot be blamed for a
      # deadlock -- the run just settles early and reports success.
      #
      # Note both overloads route, to different entries: task.spawn(fn, ...) is
      # Sched.Spawn, task.spawn(thread, ...) is Sched.Resume. Same exemptions as
      # above, for the same reasons.
      - name: Thread starts must route through Internal/Sched
        run: |
          HITS=$(grep -rnF --include='*.luau' \
            -e 'task.spawn(' -e 'task.defer(' \
            src \
            | grep -v 'src/Internal/Store/' \
            | grep -v 'src/Internal/Sched.luau' \
            | grep -v 'src/Internal/Signal.luau' \
            | grep -v 'DebugHook.luau' \
            | grep -v ':[[:space:]]*--' || true)
          if [ -n "$HITS" ]; then
            echo "::error::raw task.spawn/task.defer outside Internal/Sched:"
            echo "$HITS"
            echo 'Use Sched.Spawn(fn, ...) / Sched.Defer(fn, ...) / Sched.Resume(thread, ...).'
            exit 1
          fi
          echo 'All thread starts route through Internal/Sched.'

      # The third seam, for what the value is. Jitter exists to decorrelate a
      # fleet, so a draw the simulation cannot pin turns every replay into a
      # different run -- and the digest specs that compare run() to run() would
      # start failing intermittently, which reads as flakiness rather than as the
      # missing seam it is.
      #
      # math.random is banned outright rather than routed: it draws from a state
      # shared with the game, so Scribe consuming it shifts the sequence every
      # other script sees. Random.new is banned because it does not exist off
      # Roblox and would break the headless runner.
      #
      # Note these match CALL syntax, exactly as the two gates above do. That is
      # load-bearing here: `math.random` appears as prose inside the
      # DERIVED_MISMATCH diagnostic string at src/Internal/Node.luau:2157, on a
      # line that begins with `..` rather than `--`, so the comment filter would
      # not skip it. Matching `math.random(` costs nothing and keeps the largest
      # file in the codebase inside the gate instead of exempting it wholesale.
      - name: Random draws must route through Internal/Rng
        run: |
          HITS=$(grep -rnF --include='*.luau' \
            -e 'math.random(' -e 'math.randomseed(' -e 'Random.new(' \
            src \
            | grep -v 'src/Internal/Store/' \
            | grep -v 'src/Internal/Rng.luau' \
            | grep -v 'DebugHook.luau' \
            | grep -v ':[[:space:]]*--' || true)
          if [ -n "$HITS" ]; then
            echo "::error::raw randomness outside Internal/Rng:"
            echo "$HITS"
            echo 'Use Rng.Next(). math.random shares its state with the game; Random.new does not exist headless.'
            exit 1
          fi
          echo 'All random draws route through Internal/Rng.'

      # A log code is part of the public surface twice over: games switch on
      # Types.LogCode, and operators look codes up in the guide after seeing one
      # in the console. Neither is enforced by anything else -- Log.Warn takes its
      # code as a plain string, so an unregistered code type-checks perfectly, and
      # the analyze step above covers test/TypeCheck.luau by design, which never
      # names one. Measured decay: the four codes added by the frame-fragmentation
      # work registered 0 of 4 in the union and 3 of 4 in the guide.
      - name: Every emitted log code must be declared and documented
        run: lune run lune/check-log-codes

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same guard the release workflows run, at PR time so version drift is
      # caught on the branch that introduced it, not at (immutable) publish time.
      - name: wally.toml must match src/Internal/Version.luau
        run: |
          WALLY_VER="$(grep -m1 '^version' wally.toml | sed 's/.*"\(.*\)".*/\1/')"
          SRC_VER="$(grep -o '"[0-9][^"]*"' src/Internal/Version.luau | tr -d '"')"
          if [ "$WALLY_VER" != "$SRC_VER" ]; then
            echo "::error::version mismatch: wally.toml=$WALLY_VER Version.luau=$SRC_VER"
            echo "Bump wally.toml and src/Internal/Version.luau together."
            exit 1
          fi
          echo "Version $WALLY_VER consistent."
      # sync-version.yml rewrites the README on a push to main, but a silently
      # failed sync would leave the front-page install snippet on the previous
      # version with no signal. Verify it here instead of trusting the bot.
      - name: README install snippet must match wally.toml
        run: |
          WALLY_VER="$(grep -m1 '^version' wally.toml | sed 's/.*"\(.*\)".*/\1/')"
          if ! grep -q "ericplane/scribe@$WALLY_VER" README.md; then
            echo "::error::README.md install snippet does not reference $WALLY_VER"
            grep -n 'ericplane/scribe@' README.md || true
            exit 1
          fi
          echo "README install snippet consistent."
