site_name: Scribe
site_description: Persistent, typed, auto-replicated player data for Roblox, built on ProfileStore.
site_url: https://ericplane.github.io/Scribe/
repo_url: https://github.com/ericplane/Scribe
repo_name: ericplane/Scribe

# docs_gen/ is generated by docgen/gen.py (via the hook below) from src/ + docs/.
docs_dir: docs_gen

hooks:
  - docgen/mkdocs_hooks.py

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    # The guides are an ordered path (Beginner, then Intermediate, then
    # Advanced), so prev/next links at the foot of a page carry the reader on.
    - navigation.footer
    # SPA-style page loads. The site is small and heavily cross-linked between
    # guides and API pages, so this removes a full reload on every hop.
    - navigation.instant
    - navigation.instant.prefetch
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - search.share

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  # The guides are one ordered path, sorted by how much you need to know before
  # the page makes sense. A newcomer reads top to bottom and meets every page in
  # the order the sections below set; the footer "next" link follows the same
  # order. Reference pages sit last because you arrive at them by search, not by
  # reading forward.
  - Guides:
      - Beginner:
          - Getting Started: getting-started.md
          - Declaring Your Template: templates.md
          - Reading & Writing Values: values.md
          - Session Lifecycle: lifecycle.md
          - Testing & Edit Mode: testing.md
          - Scribe Studio: studio-plugin.md
      - Intermediate:
          - Containers: containers.md
          - Roblox Datatypes: datatypes.md
          - Big Numbers: big-numbers.md
          - Timers & Cooldowns: time.md
          - Derived Fields: derived.md
          - Replication & Visibility: visibility.md
          - Commands & Requests: commands.md
          - Monetization: monetization.md
          - Economy Analytics: economy.md
          - Leaderboards: leaderboards.md
          - Diagnostics: diagnostics.md
      - Advanced:
          - Offline Profiles: profiles.md
          - Gifting: gifting.md
          - Cross-Key Transactions: transactions.md
          - Custom Transports: transports.md
          - Security: security.md
          - Migrating to Scribe: migrating.md
      - Reference:
          - Configuration: configuration.md
          - Log Code Reference: log-codes.md
  - API:
      - Scribe: api/scribe.md
      - Server: api/server.md
      - Client: api/client.md
      - Value: api/value.md
      - BigValue: api/bigvalue.md
      # Generated by docgen/gen.py from the @interface/@type doc blocks. It is
      # what a bare `ScribeOptions` or `SaveInfo` in a signature points at.
      - Types: api/types.md
      - Signal: api/signal.md
      - Connection: api/connection.md

plugins:
  - search:
      # Most searches here are API names or log codes, and neither survives the
      # default separator. This one additionally splits on:
      #   .  so `Data.Flush` is reachable as "flush"
      #   camelCase boundaries, so `WaitForData` is reachable as "wait"
      #   _  so `PROFILE_SCHEMA_VIOLATION` is reachable as "schema violation"
      # The dot rule skips a dot followed by a digit, to keep `1.5e100` and
      # version numbers in one piece.
      separator: '[\s\-,:;!=?*#&+~@%$|<>{}\[\]()"''`/\\_]+|\.(?!\d)|(?!\b)(?=[A-Z][a-z])'
